<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#c9a24b" />
      <stop offset="100%" stop-color="#8c6d2e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Outer gold gradient circle -->
  <circle cx="32" cy="32" r="30" fill="url(#goldGrad)" filter="url(#glow)" />
  <circle cx="32" cy="32" r="28.5" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1" />
  <!-- LP Serif Monogram -->
  <text x="32" y="40.5" 
        font-family="'Fraunces', Georgia, 'Times New Roman', serif" 
        font-weight="800" 
        font-size="24" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="-0.5px">LP</text>
</svg>
